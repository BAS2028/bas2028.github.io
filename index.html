var TERMS=`<h3>١. القبول والتعريف</h3><p>هذا التطبيق منصة رقمية لمجموعة الحوباني الطبية للتواصل مع الكادر الطبي وطلب الخدمات. باستخدامك التطبيق أو تسجيلك حسابًا فإنك توافق على هذه الشروط.</p>
<h3>٢. طبيعة الخدمة وإخلاء المسؤولية الطبية</h3><p>المراسلة والمعلومات داخل التطبيق لا تغني عن الفحص السريري المباشر. التطبيق <b>ليس وسيلة للطوارئ</b>، وفي أي حالة خطرة اتصل بالطوارئ <b>199</b> فورًا. زر SOS يسجّل ندائك في النظام فقط ولا يضمن استجابة فورية. الاستشارة عن بعد لها حدودها وقد يطلب الكادر حضورك.</p>
<h3>٣. الحساب</h3><p>تلتزم بإدخال بيانات صحيحة وبسرية كلمة مرورك، وتتحمل مسؤولية النشاط من حسابك. للإدارة حق الموافقة على الحسابات أو رفضها أو إيقافها عند مخالفة الشروط.</p>
<h3>٤. الاستخدام المقبول</h3><p>يُمنع انتحال الصفة، أو نشر محتوى مسيء، أو محاولة الوصول إلى بيانات الآخرين أو تعطيل الخدمة، أو إدخال بيانات دفع غير صحيحة.</p>

<h3>٧. التعديل</h3><p>قد نحدّث هذه الشروط، وسنطلب موافقتك عند التغييرات الجوهرية.</p>

lick=\"addKid()\">+ إضافة طفل<\/button><\/div>${k?kidBody(k):''}`}\nfunction kidBody(k){const mo=mons(k.dob),G=S.gr.filter(x=>x.kid==k.n).sort((a,b)=>b.ts-a.ts);\n return `<div class=\"card\"><h2>${esc(k.n)} · العمر ${mo<24?Math.floor(mo)+' شهر':Math.floor(mo/12)+' سنة'}<\/h2><div class=\"vg\"><div><small>الوزن (كغ)<\/small><input id=\"gw\" inputmode=\"decimal\"><\/div><div><small>الطول (سم)<\/small><input id=\"gh\" inputmode=\"decimal\"><\/div><div><small>محيط الرأس<\/small><input id=\"gc\" inputmode=\"decimal\"><\/div><\/div><br><button class=\"go\" style=\"width:100%\" onclick=\"addGr('${esc(k.n)}')\">حفظ القياس<\/button><\/div><div class=\"card\"><h2>سجل النمو<\/h2>${G.length?G.map(x=>{const m=mons(k.dob,x.ts),md=wmed(k.sx,m),pc=md&&x.wt?Math.round(x.wt/md*100):0,cl=!pc?'':pc>=90?'طبيعي':pc>=75?'نقص خفيف':pc>=60?'نقص متوسط':'نقص شديد';return `<div class=\"row\" style=\"margin:6px 0;font-size:13px\"><span>${new Date(x.ts).toLocaleDateString('ar')} (${Math.floor(m)} شهر)<\/span><span>${x.wt?x.wt+' كغ':''} ${x.ht?x.ht+' سم':''} ${x.hc?'رأس '+x.hc:''} ${pc?'· '+pc+'% من المتوسط ('+cl+')':''}<\/span><\/div>`}).join(''):'<small>لا توجد قياسات.<\/small>'}<small>المقارنة بالمتوسط (حتى عمر 24 شهرًا) تقريبية وإرشادية، والتقييم النهائي عند الطبيب.<\/small><\/div><div class=\"card\"><h2>💉 جدول التطعيمات الإرشادي<\/h2>${VAXS.map(v=>`<div style=\"margin:6px 0;padding:6px;border-radius:10px;${mo>=v[0]&&mo<v[0]+1.5?'background:#ecfdf5':''}\"><b>${v[1]}<\/b>: ${v[2]}<\/div>`).join('')}<small>راجع جدول وزارة الصحة المعتمد ودفتر التطعيم.<\/small><\/div>`}\nfunction addKid(){const n=$('kn').value.trim(),b=$('kb').value;if(!n||!b)return alert('اكتب الاسم وتاريخ الميلاد');db.doc('profiles/'+ME.id).set({kids:F.arrayUnion(PO({n,dob:b,sx:$('kx').value}))},{merge:true}).then(()=>{$('kn').value=''}).catch(er)}\nfunction addGr(n){const o={pid:ME.id,kid:n,ts:Date.now(),by:ME.name};[['gw','wt'],['gh','ht'],['gc','hc']].forEach(a=>{const v=parseFloat($(a[0]).value);if(v>0)o[a[1]]=v});if(!o.wt oRow(ic,bg,t,d){return `<div class=\"card row\" style=\"margin:8px 0\"><div><b>${t}<\/b><br><small>${d}<\/small><\/div><span style=\"width:44px;height:44px;border-radius:14px;background:${bg};display:grid;place-items:center;font-size:22px\">${ic}<\/span><\/div>`}\nfunction phome(){const v=vlatest(),c=cen(),nx=(S.rec.ev||[]).filter(e=>e.d>=today()).sort((a,b)=>a.d<b.d?-1:1)[0],rdy=S.ord.filter(o=>o.type!='rx'&&o.status=='done').length,act=S.ord.filter(o=>o.type=='rx'&&o.status!='done').length,conf=nx&&S.rq.some(r=>r.type=='confirm'&&(r.note||'').includes(nx.t)&&(r.note||'').includes(nx.d)),\n stat=(l,x,k)=>`<div style=\"flex:1;background:#f2f5fc;border-radius:16px;padding:12px 4px;text-align:center\"><small>${l}<\/small><br><b style=\"font-size:16px;color:${k||'var(--ink)'}\">${x}<\/b><\/div>`,\n vs=(k,l,u)=>`<div class=\"vf ${v[k]?vflag(k,v[k]):''}\"><b>${v[k]?esc(v[k]):'—'}<\/b>${l}<small>${u}<\/small><\/div>`,\n wu='https://wa.me/'+c.wa+'?text='+encodeURIComponent('استشارة عاجلة — أحتاج رد فوري');\n return `<div class=\"card\"><div class=\"row\"><div><small>مرحبًا بك مجددًا<\/small><br><b style=\"font-size:18px\">${esc(ME.name)}<\/b><\/div><span class=\"pill n\">ملف طبي #${esc(ME.id.slice(0,6).toUpperCase())}<\/span><\/div><div style=\"display:flex;gap:8px;margin-top:12px\">${stat('الموعد القادم',nx?(nx.d==today()?'اليوم':nx.d.slice(5)):'—')}${stat('الفحوصات',rdy+' جاهزة','#b45309')}${stat('الوصفات النشطة',act+' نشطة','var(--teal)')}<\/div><div class=\"vg\" style=\"margin-top:10px\">${vs('pl','💓 النبض','/د')}${vs('bp','🩸 الضغط','mmHg')}${vs('sg','🍬 السكر','mg/dL')}<\/div><small><a onclick=\"go('vit')\" style=\"color:var(--teal)\">تسجيل قياس جديد<\/a><\/small><\/div>\n ${subCard()}${waCard()}\n ${nx?`<div class=\"card\"><div class=\"row\"><b>📅 تذكير بموعدك القريب<\/b><span class=\"pill ${conf?'n':''}\">${conf?'تم التأكيد':'بانتظار التأكيد'}<\/span><\/div><div style=\"background:#f2f5fc;border-radius:14px;padding:12px;margin-top:8px\"><b>${esc(nx.t)}<\/b><br><small>${nx.d==today()?'اليوم':nx.d}<\/small><div style=\"display:flex;gap:8px;margin-top:10px\"><button class=\"go\" style=\"flex:1\" onclick=\"confAtt('${esc(nx.t)}','${nx.d}')\">✅ تأكيد الحضور<\/button><button class=\"go\" style=\"flex:1;background:#e8edf7;color:#334155;box-shadow:none\" onclick=\"reschedV('${esc(nx.t)}','${nx.d}')\">🔁 إعادة جدولة<\/button><\/div><a style=\"display:block;margin-top:8px;text-align:center;color:var(--teal)\" target=\"_blank\" href=\"${remEv(nx.t,nx.d)}\">⏰ أضف تذكيرًا للجوال<\/a><\/div><\/div>`:`<div class=\"card\">📅 لا توجد مواعيد قادمة. <a onclick=\"go('req')\" style=\"color:var(--teal)\">احجز موعدًا الآن<\/a><\/div>`}\n <h2>الخدمات الطبية الرقمية<\/h2><div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:10px\">${tile('req','📅','حجز موعد','عيادات تخصصية','#e8e4ff')}${tile(wu,'🚨','استشارة عاجلة','رد فوري','#fee2e2')}${tile('res','🧪','الفحوصات','تقارير ونتائج','#ede9fe')}${tile('med','💊','الصيدلية','وصفاتي والصرف','#fef3c7')}${tile('drs','👨‍⚕️','الأطباء','نخبة التخصص','#e0e7ff')}${tile('call','📹','مكالمة مرئية','مع الطبيب','#dcfce7')}<\/div>\n <h2 style=\"margin-top:14px\">اختر القسم<\/h2><div class=\"grid\">${SECS.map((s,i)=>`<button class=\"tile ${i==0?'p1':''}\" onclick=\"openSec(${i})\"><span class=\"e\">${s.e}<\/span><b>${s.n}<\/b><small>${s.d}<\/small><\/button>`).join('')}<\/div>\n ${[['preg','🤰','متابعة الحمل','الأسبوع والفحوصات وعلامات الخطر'],['kid','🧒','نمو الأطفال','الوزن والطول والتطعيمات'],['prof','🩺','ملفي الصحي',S.pf&&(S.pf.blood||S.pf.allergies)?'مكتمل — اضغط للتعديل':'أكمل بياناتك للطوارئ']].map(a=>`<div class=\"card row\" onclick=\"go('${a[0]}')\" style=\"cursor:pointer;margin-top:12px\"><div><b>${a[1]} ${a[2]}<\/b><br><small>${a[3]}<\/small><\/div><span class=\"pill n\">+<\/span><\/div>`).join('')}\n ${P.shareBox('')}\n <h2>إرشادات وأخبار المركز الطبي<\/h2>${infoRow('❤️','#fef3c7','فحص ضغط الدم والقلب الدوري',esc(c.tip||'ننصح بقياس الضغط بانتظام والتقليل من الصوديوم للمحافظة على كفاءة الأوعية الدموية.'))}${infoRow('🕘','#e0e7ff','ساعات دوام العيادات التخصصية',esc(c.hours))}\n <div class=\"card row\" style=\"background:#f2f5fc\"><span>📍 ${esc(c.addr)}<\/span><a href=\"tel:${esc(c.tel)}\" style=\"color:var(--teal);font-weight:700;text-decoration:none\">📞 اتصال فوري<\/a><\/div>`}\nfunction confAtt(t,d){db.collection('reqs').add({type:'confirm',pid:ME.id,pname:ME.name,note:'تأكيد حضور: '+t+' '+d,status:'new',ts:Date.now()}).then(()=>alert('تم تأكيد حضورك وإبلاغ المركز')).catch(er)}\nfunction reschedV(t,d){const n=prompt('اكتب التاريخ الجديد المفضل (مثال 2026-11-05)');if(!n)return;if(!/^\\d{4}-\\d{2}-\\d{2}$/.test(n.trim()))return alert('اكتب التاريخ هكذا: 2026-11-05');db.collection('reqs').add({type:'appt',pid:ME.id,pname:ME.name,when:n.trim(),note:'طلب إعادة جدولة موعد '+t+' ('+d+')',status:'new',ts:Date.now()}).then(()=>alert('تم إرسال طلب إعادة الجدولة')).catch(er)}\nfunction tparse(h){const m=String(h||'').match(/(\\d{1,2})(?::(\\d{2}))?\\s*(ص|م|am|pm)?/i);let H=m?+m[1]:8;const M=m&&m[2]?+m[2]:0,p=(m&&m[3])||'';if(/م|pm/i.test(p)&&H<12)H+=12;if(/ص|am/i.test(p)&&H==12)H=0;if(H>23)H=8;return[H,M]}\nfunction p2(n){return String(n).padStart(2,'0')}\nfunction remMed(n,h){const t=tparse(h),d=today().replace(/-/g,''),e=Math.min(t[1]+15,59);return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent('💊 '+n)+'&details='+encodeURIComponent('تذكير بالدواء — مجموعة الحوباني الطبية')+'&dates='+d+'T'+p2(t[0])+p2(t[1])+'00/'+d+'T'+p2(t[0])+p2(e)+'00&recur=RRULE:FREQ=DAILY'}\nfunction remEv(t,d){const a=d.replace(/-/g,''),b=new Date(new Date(d).getTime()+864e5).toISOString().slice(0,10).replace(/-/g,'');return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent('📅 '+t)+'&dates='+a+'/'+b}\nfunction rateTxt(did){const r=(P.RAT||[]).filter(x=>x.did==did);return r.length?`<small>⭐ ${(r.reduce((a,x)=>a+x.stars,0)/r.length).toFixed(1)} (${r.length} تقييم)<\/small><br>`:''}\nfunction rateCs(id){const c=S.cs.find(x=>x.id==id);if(!c)return;const v=parseInt(prompt('قيّم الطبيب من 1 إلى 5'),10);if(!(v>=1&&v<=5))return;const t=prompt('تعليق (اختياري)')||'';db.collection('ratings').doc(id).set({cid:id,did:c.did,duid:c.duid,pid:ME.id,pname:ME.name,stars:v,text:t,ts:Date.now()}).then(()=>alert('شكرًا لتقييمك')).catch(er)}\nfunction commCard(m){const pct=m.pct!=null?+m.pct:+((P.BILL||{}).comm||0),rt=(P.RAT||[]).filter(x=>x.did==m.id),av=rt.length?(rt.reduce((a,x)=>a+x.stars,0)/rt.length).toFixed(1):'—',tot=S.cs.filter(c=>c.st=='ok'&&c.amt>0).reduce((a,c)=>a+(+c.amt),0),due=Math.round(tot*pct/100),paid=(P.SETT||[]).reduce((a,x)=>a+(+x.amt),0);\n return `<div class=\"card\"><b>⭐ تقييمك: ${av}<\/b> <small>(${rt.length} تقييم)<\/small><\/div>${pct?`<div class=\"card\" style=\"background:#fffbeb\"><b>عمولة التطبيق: ${pct}%<\/b><br><small>إجمالي الاستشارات المؤكدة: ${tot} ر.ي · المستحق للتطبيق: <b>${due}<\/b> · المسدد: ${paid} · المتبقي: <b>${Math.max(0,due-paid)} ر.ي<\/b><\/small><br><small>يُسدَّد المتبقي إلى إدارة التطبيق عبر الوسيلة التي تحددها لك.<\/small><\/div>`:''}`}\nfunction locked(){const t=P.subState?P.subState():{};return !!t.expired}\nfunction gate(fn){return(!staff&&locked()&&['home','req','call','drs','dpay'].includes(S.tab))?paywallV():fn()}\nfunction paywallV(){const b=P.BILL||{};return `<div class=\"card\" style=\"text-align:center\"><h2>🔒 انتهت الفترة التجريبية<\/h2><p>للاستمرار في المراسلة وحجز الاستشارات والمكالمات اشترك بـ <b>${esc(b.price||'')} ر.ي<\/b> لمدة <b>${esc(b.days||30)}<\/b> يومًا.<\/p><button class=\"go\" style=\"width:100%\" onclick=\"P.openSub()\">💳 اشترك الآن<\/button><br><small>زر الطوارئ SOS يبقى مجانيًا دائمًا، ويمكنك الاطلاع على وصفاتك ونتائجك وملفك الصحي.<\/small><\/div>`}\nfunction subCard(){const t=P.subState?P.subState():{},b=P.BILL||{};if(t.trial)return `<div class=\"card\" style=\"background:#ecfdf5\">🎁 فترة تجريبية مجانية: متبقٍ <b>${t.left}<\/b> يوم. بعدها اشتراك رمزي (${esc(b.price||'')} ر.ي لكل ${esc(b.days||30)} يوم).<\/div>`;if(t.paid)return `<d ,"docs.html":"<!DOCTYPE html><html lang=\"ar\" dir=\"rtl\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\n<link href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap\" rel=\"stylesheet\">\n<title>الكاميرا والملفات<\/title>\n<style>\n:root{--g:#047857;--g2:#064e3b;--gl:#d1fae5;--ln:#e3eaf3;--mu:#64748b;--in:#f8fafc}\n*{box-sizing:border-box;margin:0}\nbody{font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;background:#eef3f9;color:#0f1f35;padding:12px 12px calc(24px + env(safe-area-inset-bottom,0px))}\n.card{background:#fff;border:1px solid var(--ln);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 4px 14px #0f1f3510}\nh2{font-size:16px;margin-bottom:2px}p.s{font-size:12px;color:var(--mu);margin-bottom:8px}\nlabel{display:block;font-weight:700;font-size:13px;margin:12px 0 6px}\ninput,select{width:100%;background:var(--in);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;font:inherit;font-size:14px;color:inherit}\n.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}\n.cam{display:flex;flex-direction:column;align-items:center;gap:4px;border:2px dashed #6ee7b7;background:var(--gl);color:var(--g2);border-radius:18px;padding:18px 6px;font-weight:700;font-size:14px;cursor:pointer}\n.cam span{font-size:30px}.cam.o{border-color:#7dd3fc;background:#e0f2fe;color:#0369a1}\n.cam input{display:none}\n.btn{width:100%;border:0;border-radius:14px;padding:14px;color:#fff;font:inherit;font-weight:700;font-size:15px;background:var(--g);cursor:pointer;margin-top:12px}.btn:disabled{background:#94a3b8}\n#pv{display:none;margin-top:12px;text-align:center}#pv img{max-width:100%;max-height:260px;border-radius:14px;border:1px solid var(--ln)}\n.msg{font-size:13px;color:#dc2626;margin-top:8px;min-height:18px}.msg.ok{color:var(--g)}\n.it{display:flex;gap:10px;background:var(--in);border:1px solid var(--ln);border-radius:14px;p
